<script src="chat.js?v=20261030084010"></script>
<script>
// sin internet: el service worker guarda el atlas completo la primera vez que se abre con conexión
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => {
    const aviso = () => { const t = document.getElementById("toast"); t.textContent = "📥 Atlas guardado completo: ya funciona sin internet"; t.className = "bien ver"; setTimeout(() => t.classList.remove("ver"), 3500); };
    navigator.serviceWorker.addEventListener("message", ev => { if (ev.data === "atlas-completo") aviso(); });
    navigator.serviceWorker.register("sw.js").catch(() => {});
    // las láminas grandes se guardan después de que la página ya se ve (y se completan si faltara alguna)
    navigator.serviceWorker.ready.then(reg => setTimeout(() => reg.active && reg.active.postMessage("guardar-resto"), 1500));
  });
}
</script>
